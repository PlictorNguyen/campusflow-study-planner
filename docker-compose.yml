services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-campusflow-local}
    volumes:
      - campusflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/campusflow
      DATABASE_USER: campusflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-campusflow-local}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
    ports:
      - "8080:8080"
volumes:
  campusflow-db:
